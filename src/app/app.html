<app-header></app-header>

<main class="av-main">
  <router-outlet />
</main>

@if (showInstallButton() && isFrontPage()) {
  <button class="av-install-banner av-btn" (click)="install()">
    <span class="material-icons" aria-hidden="true">download</span>
    {{ 'install.button' | t }}
  </button>
}

@if (showVibesDialog() && isFrontPage()) {
  <app-vibes-dialog (dismissed)="showVibesDialog.set(false)" />
}
