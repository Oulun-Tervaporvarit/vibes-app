<header class="av-header">
  <div class="av-header__inner">
    <div class="av-brand-row">
      <a class="av-brand" routerLink="/" aria-label="Allvibes Passi">
        <img class="av-brand__logo" src="/icons/pink-smile.png" alt="Allvibes" />
      </a>
      <span class="av-brand-row__divider" aria-hidden="true"></span>
      <img class="av-brand__partner" src="/icons/tervis.png" alt="JCI Tervis" />
    </div>

    <div class="av-header__right">
      @if (code === validCode) {
        <div class="av-benefits-badges">
          @for (b of benefits; track b.category) {
            <div class="av-benefits-badge">
              <span class="material-icons av-benefits-badge__icon" aria-hidden="true">{{ b.icon }}</span>
              <span class="av-benefits-badge__count">{{ b.count }}</span>
              <span class="av-benefits-badge__label">{{ b.label }}</span>
            </div>
          }
        </div>

        <div class="av-code-display">
          <span class="av-code-display__icon material-icons" aria-hidden="true">vpn_key</span>
          <span class="av-code-display__value">{{ code }}</span>
          <button
            type="button"
            class="av-code-display__clear"
            (click)="clearCode()"
            aria-label="Poista koodi"
          >
            <span class="material-icons" aria-hidden="true">close</span>
          </button>
        </div>
      } @else {
        <label class="av-code-input">
          <span class="av-code-input__icon material-icons" aria-hidden="true">vpn_key</span>
          <input
            [(ngModel)]="code"
            (input)="onCodeChange($event)"
            placeholder="Syötä etukoodi"
            aria-label="Etukoodi"
            autocomplete="off"
            spellcheck="false"
          />
        </label>
      }
    </div>
  </div>
</header>
