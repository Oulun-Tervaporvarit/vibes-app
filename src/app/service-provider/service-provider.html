<mat-card class="provider-card" appearance="outlined">
  <mat-card-header style="margin-bottom: 15px;">
    <button matButton (click)="location.back()"><mat-icon aria-hidden="false" fontIcon="arrow_back"></mat-icon>Takaisin</button>
  </mat-card-header>
  
  <mat-card-content>
    <div class="flex flex-row gap-4">
        <img mat-card-image [src]="item.image" style="max-width: 50%; object-fit: contain;">
        <div class="provider-card">

            <div>
               <b>{{ item.title }}</b>
            </div>
            <div>
                Osoite: Shiba street 1, Tokyo<br>
                Aukioloajat: Ma-Pe 9-17<br>
            </div>
            <div>
                <p class="alert">
                    <b>Tärkeää tietoa</b>
                    <br />
                    Klikkaa "näytä henkilökunnalle" vasta kun olet paikan päällä.
                </p>
                <button matButton="filled" style="text-transform: uppercase; margin-bottom: 15px;">Näytä henkilökunnalle</button>
            </div>
            
            <p>
                <b>Kuvaus</b>
                <br />
                {{ item.description }}

            </p>
            <mat-divider></mat-divider>
            <p>
                <b>Näin pääset hyödyntämään</b>
                <br />
                Tähän ohjeita ...
            </p>
            <mat-divider></mat-divider>
            
            TODO: Tähän sijainti google maps kartalla
        </div>
        
    </div>
  </mat-card-content>
  <mat-card-actions>
  </mat-card-actions>
</mat-card>
