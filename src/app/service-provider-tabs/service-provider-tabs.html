<section class="av-tabs-hero">
  <div class="av-tabs-hero__inner">
    <p class="av-tabs-hero__eyebrow">{{ 'hero.eyebrow' | t }}</p>
    <h1 class="av-tabs-hero__title">{{ 'hero.title' | t }}</h1>
    <p class="av-tabs-hero__sub">
      {{ 'hero.sub' | t }}
    </p>
    <a class="av-tabs-hero__help" routerLink="/ohje">
      <span class="material-icons" aria-hidden="true">help_outline</span>
      {{ 'hero.help' | t }}
    </a>
  </div>
</section>

<mat-tab-group class="av-tabs" mat-stretch-tabs="false" mat-align-tabs="center" animationDuration="200ms">
  <mat-tab>
    <ng-template mat-tab-label>
      <span class="material-icons av-tab-icon" aria-hidden="true">directions_run</span>
      {{ 'cat.exercise' | t }}
    </ng-template>
    <app-service-providers-list category="exercise"></app-service-providers-list>
  </mat-tab>
  <mat-tab>
    <ng-template mat-tab-label>
      <span class="material-icons av-tab-icon" aria-hidden="true">theater_comedy</span>
      {{ 'cat.culture' | t }}
    </ng-template>
    <app-service-providers-list category="culture"></app-service-providers-list>
  </mat-tab>
  <mat-tab>
    <ng-template mat-tab-label>
      <span class="material-icons av-tab-icon" aria-hidden="true">spa</span>
      {{ 'cat.wellness' | t }}
    </ng-template>
    <app-service-providers-list category="wellness"></app-service-providers-list>
  </mat-tab>
  <mat-tab labelClass="av-tab-all">
    <ng-template mat-tab-label>
      <span class="material-icons av-tab-icon" aria-hidden="true">list</span>
      {{ 'tab.all' | t }}
    </ng-template>
    <app-service-providers-list [compact]="true"></app-service-providers-list>
  </mat-tab>
</mat-tab-group>
